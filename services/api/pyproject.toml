[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bursarbridge"]

[project]
name = "bursarbridge-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlmodel>=0.0.24,<0.1",
  "langgraph>=1,<2", "PyJWT[crypto]>=2.10,<3", "base58>=2.1,<3",
  "webauthn>=2.2,<3", "web3>=7,<8", "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1", "pypdf>=6,<7", "reportlab>=4,<5", "PyYAML>=6,<7",
  "python-dotenv>=1,<2"
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
